name: CI Build & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build API Package
        run: npm run build --workspace=@piscinao/api

      - name: Build Client Web App
        run: npm run build --workspace=@piscinao/client-web

      - name: Build Admin Panel App
        run: npm run build --workspace=@piscinao/admin
